[package]
name = "omnia-session-store"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Canonical transport-independent Omnia session storage and navigation"
publish = false

[features]
default = []
# Explicit support for the desktop test harness. Normal runtime consumers do
# not receive APIs that stage in-memory stores or synthetic running sessions.
test-support = []

[dependencies]
omnia-harness = { path = "../omnia-harness" }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
