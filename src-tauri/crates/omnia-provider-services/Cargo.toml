[package]
name = "omnia-provider-services"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Shared native provider credential services for Omnia hosts"
publish = false

[dependencies]
omnia-harness = { path = "../omnia-harness" }
omnia-session-store = { path = "../omnia-session-store" }
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
