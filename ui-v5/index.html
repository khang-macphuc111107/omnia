<!DOCTYPE html>
<html lang="vi" data-theme="obsidian">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23080A0F'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%2338BDF8' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23F0B44C'/%3E%3C/svg%3E" />
  <title>Omnia Studio</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('omnia.studio.theme') || 'obsidian';
        var resolved = stored;
        if (stored === 'system') {
          resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'alabaster' : 'obsidian';
        }
        var valid = ['obsidian', 'titanium', 'alabaster', 'blueprint'];
        if (valid.indexOf(resolved) === -1) resolved = 'obsidian';
        document.documentElement.setAttribute('data-theme', resolved);
        document.documentElement.setAttribute('data-theme-pref', stored);
        var bgMap = {
          obsidian: '#080A0F',
          titanium: '#1F2328',
          alabaster: '#F6F5F0',
          blueprint: '#070E1B'
        };
        document.documentElement.style.backgroundColor = bgMap[resolved] || '#080A0F';
        document.documentElement.style.colorScheme = resolved === 'alabaster' ? 'light' : 'dark';
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
