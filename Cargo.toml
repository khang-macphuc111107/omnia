[workspace]
resolver = "2"
members = [
    "rust/omnia-winsqlite",
    "rust/omnia-core",
    "rust/omnia-storage",
    "rust/omnia-routing",
    "rust/omnia-graph",
    "rust/omnia-harness",
    "rust/omnia-connector-gateway",
    "rust/omnia-workspace-ops",
    "rust/omnia-media-capture",
    "rust/omnia-remote-control",
    "rust/omnia-runtime",
    "rust/omnia-studio",
    "rust/omnia-native",
    "rust/omnia-agent",
    "rust/omnia-cli",
    "rust/omnia-downloader",
    "rust/omnia-notebook",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
# Core & async networking
aes = "0.8"
aho-corasick = "1"
anyhow = "1"
base64 = "0.23"
blake3 = "1.8"
bytes = "1"
cbc = "0.1"
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "1"
dirs = "6"
flate2 = "1"
futures-util = "0.3"
getrandom = "0.4"
glob = "0.3"
ignore = "0.4"
imara-diff = "0.2"
memchr = "2"
mimalloc = { version = "0.1", default-features = false }
parking_lot = "0.12"
quick-xml = "0.37"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rustc-hash = "2"
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tree-sitter = "0.25"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
which = "6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

# Internal workspace crate aliases
omnia-winsqlite = { path = "rust/omnia-winsqlite" }
omnia-core = { path = "rust/omnia-core" }
omnia-storage = { path = "rust/omnia-storage" }
omnia-routing = { path = "rust/omnia-routing" }
omnia-graph = { path = "rust/omnia-graph" }
omnia-harness = { path = "rust/omnia-harness" }
omnia-connector-gateway = { path = "rust/omnia-connector-gateway" }
omnia-workspace-ops = { path = "rust/omnia-workspace-ops" }
omnia-agent = { path = "rust/omnia-agent" }
omnia-downloader = { path = "rust/omnia-downloader" }
omnia-notebook = { path = "rust/omnia-notebook" }

[profile.dev]
incremental = true

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package.blake3]
opt-level = 3

[profile.release.package.memchr]
opt-level = 3

[profile.release.package.xxhash-rust]
opt-level = 3

[profile.release.package.imara-diff]
opt-level = 3
