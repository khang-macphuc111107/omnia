[package]
name = "omnia-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Independent native Windows shell for the Omnia Rust migration"
license = "MIT"

# Deliberately independent of the desktop workspace and its Tauri build script.
[workspace]

[dependencies]
omnia-session-store = { path = "../src-tauri/crates/omnia-session-store" }
omnia-provider-services = { path = "../src-tauri/crates/omnia-provider-services" }
omnia-harness = { path = "../src-tauri/crates/omnia-harness" }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
