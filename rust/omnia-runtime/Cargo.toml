[package]
name = "omnia-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
futures-util = "0.3"
omnia-connector-gateway.workspace = true
omnia-core.workspace = true
omnia-routing.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "time", "io-util"] }
url = "2"
